name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore VisionCareCore.sln
      - run: dotnet build VisionCareCore.sln --no-restore -c Release
      - run: dotnet test VisionCareCore.sln --no-build -c Release --verbosity normal

  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Validar docker-compose
        run: docker compose config --quiet
      - name: Construir y levantar la API con SQL Server
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Verificar /health
        run: curl --fail --silent --show-error --retry 20 --retry-delay 3 --retry-all-errors http://localhost:5080/health
      - name: Logs si algo falla
        if: failure()
        run: docker compose logs
      - name: Bajar los contenedores
        if: always()
        run: docker compose down -v
