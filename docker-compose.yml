# Entorno local: API y SQL Server. Los valores por defecto son falsos y solo sirven para desarrollo;
# se pueden sobrescribir con variables de entorno o un archivo .env (ignorado por git).
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-VisionCare_Dev_2026}
    ports:
      - "${SQLSERVER_PORT:-1433}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build: .
    depends_on:
      sqlserver:
        condition: service_healthy
    ports:
      - "${API_PORT:-5080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      # Aplica las migraciones al arrancar aunque el entorno no sea Development
      Database__AplicarMigraciones: "true"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=VisionCare;User Id=sa;Password=${MSSQL_SA_PASSWORD:-VisionCare_Dev_2026};TrustServerCertificate=True"
      TokenSettings__Secret: ${TOKEN_SECRET:-solo-para-desarrollo-no-usar-en-produccion-0123}
      AzureVision__Endpoint: ${AZURE_VISION_ENDPOINT:-https://vision.example.test/}
      AzureVision__Key: ${AZURE_VISION_KEY:-clave-falsa}
      OpenAI__ApiKey: ${OPENAI_API_KEY:-clave-falsa}
      OpenAI__AssistantId: ${OPENAI_ASSISTANT_ID:-asistente-falso}

volumes:
  sqlserver-data:
